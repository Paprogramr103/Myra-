name: MYRA UI branch build

on:
  push:
    branches:
      - feature/maya-inspired-ui-settings
    paths:
      - 'extracted-myra/Pagali-fix-ai-brain-hardening/app/src/**'
      - 'extracted-myra/Pagali-fix-ai-brain-hardening/app/build.gradle.kts'
      - 'extracted-myra/Pagali-fix-ai-brain-hardening/gradle.properties'
      - 'extracted-myra/Pagali-fix-ai-brain-hardening/gradle/**'
      - 'extracted-myra/Pagali-fix-ai-brain-hardening/build.gradle.kts'
      - '.github/workflows/myra-ui-branch-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: extracted-myra/Pagali-fix-ai-brain-hardening/**/*.gradle*

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download and prepare offline Hey MYRA wake-word model
        working-directory: extracted-myra/Pagali-fix-ai-brain-hardening
        shell: bash
        run: |
          set -euo pipefail
          MODEL_NAME="sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
          MODEL_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/${MODEL_NAME}.tar.bz2"
          mkdir -p app/src/main/assets
          curl --fail --location --retry 4 --retry-all-errors "${MODEL_URL}" --output /tmp/myra-kws-model.tar.bz2
          tar -xjf /tmp/myra-kws-model.tar.bz2 -C app/src/main/assets
          python3 -m pip install --disable-pip-version-check "sherpa-onnx==1.13.5"
          printf 'HEY MYRA\\nHI MYRA\\nHELLO MYRA\\nOKAY MYRA\\n' > "app/src/main/assets/${MODEL_NAME}/keywords_raw.txt"
          sherpa-onnx-cli text2token \
            --tokens "app/src/main/assets/${MODEL_NAME}/tokens.txt" \
            --tokens-type bpe \
            --bpe-model "app/src/main/assets/${MODEL_NAME}/bpe.model" \
            "app/src/main/assets/${MODEL_NAME}/keywords_raw.txt" \
            "app/src/main/assets/${MODEL_NAME}/keywords.txt"
          rm -f /tmp/myra-kws-model.tar.bz2
          rm -f "app/src/main/assets/${MODEL_NAME}/bpe.model" "app/src/main/assets/${MODEL_NAME}/keywords_raw.txt"
          rm -rf "app/src/main/assets/${MODEL_NAME}/test_wavs"
          test -s "app/src/main/assets/${MODEL_NAME}/keywords.txt"

      - name: Prepare debug signing
        working-directory: extracted-myra/Pagali-fix-ai-brain-hardening
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        working-directory: extracted-myra/Pagali-fix-ai-brain-hardening
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --no-configuration-cache --stacktrace testDebugUnitTest; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle test attempt $attempt failed; retrying after Maven Central cooldown."
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - name: Build debug APK
        working-directory: extracted-myra/Pagali-fix-ai-brain-hardening
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --no-configuration-cache --stacktrace assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle APK build attempt $attempt failed; retrying after dependency cooldown."
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: MYRA-ui-preview-debug-apk
          path: extracted-myra/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
